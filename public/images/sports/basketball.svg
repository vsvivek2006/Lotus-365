      <stop offset="0%" stop-color="#241108" /><stop offset="100%" stop-color="#14614C" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="24" fill="url(#sportBg_basketball)" />
  <rect x="4" y="4" width="592" height="392" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" />

  <!-- Badge -->
  <rect x="30" y="30" width="110" height="32" rx="16" fill="#ea580c" />
  <text x="85" y="51" font-family="'Poppins', Arial, sans-serif" font-weight="900" font-size="13" fill="#ffffff" text-anchor="middle">NBA</text>

  <!-- Center Graphic -->
  <g transform="translate(300, 180)">
