   <path d="M 35 -35 Q 0 0 35 35" stroke="#111" stroke-width="3" fill="none"/>
  </g>

  <!-- Titles -->
  <rect x="0" y="290" width="600" height="110" rx="20" fill="#041611" opacity="0.9" />
  <text x="30" y="335" font-family="'Poppins', Arial, sans-serif" font-weight="800" font-size="26" fill="#ffffff">Basketball & NBA</text>
  <text x="30" y="370" font-family="'Poppins', Arial, sans-serif" font-weight="600" font-size="16" fill="#F0C419">Quarter Points, Point Spread & Totals</text>

  <!-- Trade Button -->
